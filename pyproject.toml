[project]
name = "iron-sql"
version = "1.5.8"

description = "iron_sql generates typed async PostgreSQL clients and runtime helpers from schemas and SQL queries"
readme = "README.md"
authors = [{ name = "Ilia Ablamonov", email = "ilia@flamefork.ru" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["postgresql", "sql", "sqlc", "psycopg", "codegen", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

requires-python = ">=3.13"
dependencies = [
    "psycopg>=3.3.2",
    "psycopg-pool>=3.3.0",
    "pydantic>=2.12.4",
]

[project.optional-dependencies]
codegen = [
    "inflection>=0.5.1",
    "sqlc>=1.30.0.post19",
]

[project.urls]
Homepage = "https://github.com/Flamefork/iron_sql"
Repository = "https://github.com/Flamefork/iron_sql.git"
Issues = "https://github.com/Flamefork/iron_sql/issues"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "iron-sql[codegen]",
    "basedpyright>=1.31.7",
    "hypothesis>=6.165.2",
    "mutmut>=3.7.0,<4",
    "psycopg[binary]>=3.3.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-randomly>=4.0.1",
    "ruff>=0.14.1",
    "testcontainers>=4",
]

[tool.basedpyright]
include = ["src", "tests", "example"]
typeCheckingMode = "all"
deprecateTypingAliases = true
reportUnannotatedClassAttribute = "none"
reportUnusedCallResult = "none"
reportExplicitAny = "none"

[tool.mutmut]
also_copy = ["README.md", "example/"]

[tool.ruff]
target-version = "py313"

[tool.ruff.format]
preview = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "ANN",
    "COM812",
    "CPY",
    "D",
    "FIX",
    "G004",
    "ISC001",
    "PLC1901",
    "PLR0911",
    "PLR0915",
    "PLR6301",
    "RUF001",
    "RUF002",
    "RUF003",
    "TC006",
    "TD",
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["A002", "PLR2004", "S", "FBT", "E402"]
"tests/conftest.py" = ["S404", "S603"]
"tests/generated/**/*.py" = ["PGH004"]
"example/*.py" = ["E501", "T201", "PGH004"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
strict = true
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore:.*wait_container_is_ready:DeprecationWarning",
]
addopts = [
    "--import-mode=importlib",
    "--no-cov-on-fail",
    "--cov-report=term-missing:skip-covered",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
omit = ["tests/*.py", "testdb.py"]
data_file = ".coverage/db.sqlite"

[tool.coverage.html]
directory = ".coverage/htmlcov"

[tool.coverage.report]
exclude_also = ["@overload", "raise AssertionError"]
fail_under = 99
